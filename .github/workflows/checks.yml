name: Launcher checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb libegl1 libopengl0
      - name: Install native encoder
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python tests/fetch_native_encoder.py
      - name: Run launcher regression checks
        if: runner.os != 'Linux'
        run: python tests/run_smoke.py
      - name: Run Linux regression and UI checks
        if: runner.os == 'Linux'
        run: xvfb-run -a python tests/run_smoke.py
