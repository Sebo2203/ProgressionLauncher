name: Build macOS

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag for macOS test builds
        required: true
        default: v0.4.4-macos-test
  push:
    branches: [master]
    paths:
      - progressor.py
      - progression_logo.png
      - collection_cache.json
      - build_macos.sh
      - tests/**
      - todds/**
      - .github/workflows/build-macos.yml

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.event.inputs.release_tag || 'v0.4.4-macos-test' }}
      MAC_ZIP: ProgressionLauncher-macOS-v0.4.4-${{ matrix.arch }}-test.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check launcher behavior
        run: |
          python tests/macos_compat_smoke.py
          python tests/local_update_smoke.py
          python tests/custom_local_mod_smoke.py
          python tests/workshop_reuse_smoke.py
          python tests/live_launch_smoke.py
      - name: Build native app and encoder
        run: bash build_macos.sh
      - name: Check native texture conversion
        run: python tests/texture_optimizer_smoke.py
      - name: Sign and package app
        run: |
          find "dist/Progression Launcher.app" -type f -path '*/todds/todds' -exec codesign --force --sign - {} \;
          codesign --force --deep --sign - "dist/Progression Launcher.app"
          codesign --verify --deep --strict "dist/Progression Launcher.app"
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "Progression Launcher.app" "$MAC_ZIP"
          shasum -a 256 "$MAC_ZIP" > "$MAC_ZIP.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: Progression-Launcher-macOS-${{ matrix.arch }}
          path: |
            dist/${{ env.MAC_ZIP }}
            dist/${{ env.MAC_ZIP }}.sha256
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Progression Launcher v0.4.4 macOS Test
          prerelease: true
          make_latest: false
          overwrite_files: true
          body_path: MAC_TESTER.md
          files: |
            dist/${{ env.MAC_ZIP }}
            dist/${{ env.MAC_ZIP }}.sha256
